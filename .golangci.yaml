version: "2"
linters:
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # FIXME: golang.org/x/net deprecated the http2 and http2/h2c packages in
      # favour of setting http.Server.Protocols and http.HTTP2Config. Migrating
      # the serving path is out of scope for a dependency bump; tracked
      # separately.
      - linters:
          - staticcheck
        text: "SA1019:.*golang.org/x/net/http2"
    paths:
      - test/
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
